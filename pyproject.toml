[project]
name = "motivated-engine"
version = "0.1.0"
description = "PRC Data Challenge 2026 — taxi-out time prediction (team motivated-engine)"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
    "pyyaml>=6.0.3",
    "orjson>=3.12.0",
    "minio>=7.2.20",
    "torch==2.14.1",
    "scikit-learn==1.9.1",
]

[project.scripts]
prc = "prc.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prc"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: needs the full DuckDB build"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
